# Host networking: same network path as the VPS (where `nc` to the device works).
# Bridge NAT often breaks ZK TCP/UDP to remote port-forwarded devices.
# nginx still proxies to 127.0.0.1:3001 on the host.

services:
  zkteco-adms:
    build: .
    container_name: zkteco-adms
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./secrets/firebase-sa.json:/run/secrets/firebase-sa.json:ro
    environment:
      PORT: "3001"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-ecf-hr}"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-sa.json"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
