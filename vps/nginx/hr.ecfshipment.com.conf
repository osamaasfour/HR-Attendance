# nginx for hr.ecfshipment.com on DataBaseMart VPS
#
# HTTPS is terminated at the DataBaseMart Free SSL gateway (same as
# check-printer / odoo18c). This VPS nginx only listens on port 80.
# Gateway maps: hr.ecfshipment.com → 192.168.122.23:80
#
# SETUP:
# 1. sudo cp this file → /etc/nginx/sites-available/hr.ecfshipment.com
# 2. sudo ln -sf .../sites-available/hr.ecfshipment.com \
#               .../sites-enabled/hr.ecfshipment.com
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. Do NOT enable certbot on this host for this domain.
# 5. In DataBaseMart Website Management, map:
#      Domain: hr.ecfshipment.com
#      Target: 192.168.122.23 port 80
#      Certificate: Free SSL

server {
    listen 80;
    listen [::]:80;
    server_name hr.ecfshipment.com;

    client_max_body_size 52m;

    access_log /var/log/nginx/hr-zkteco.access.log;
    error_log  /var/log/nginx/hr-zkteco.error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Gateway terminates TLS; tell the app the original scheme was HTTPS
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
